###############################################
# H2 IN-MEMORY DATABASE FOR TESTING
###############################################
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.task.scheduling.enabled=false

###############################################
# REDDIT SCRAPER TEST PROPERTIES
###############################################
# Provide dummy values so @Value injections succeed
scraping.reddit.subreddits=java,programming,technology
scraping.reddit.postsPerSubreddit=5


###############################################
# PROXY CONFIG (SAFE DEFAULTS FOR TESTS)
###############################################
proxy.enabled=false
proxy.host=localhost
proxy.port=8080


###############################################
# LOGGING (OPTIONAL)
###############################################
logging.level.com.aziz0519=INFO


